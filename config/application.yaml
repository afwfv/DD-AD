# DD-AD 广告过滤规则订阅
# 上游项目：https://github.com/fordes123/ad-filters-subscriber
# 配置说明：config/application-example.yaml
#
# 输入：name 唯一；path 支持 http(s) 或本地路径；type/dialect 必填
# 输出：name 为 output-dir 内的文件名；未单独声明 file-header 时继承 config.file-header

adfs:
  input:
    # ---------- AdGuard 官方过滤器（ublock 兼容构建）----------
    - name: AdGuard 基础过滤器
      path: https://filters.adtidy.org/extension/ublock/filters/2_optimized.txt
      type: adblock
      dialect: ubo

    - name: AdGuard 移动广告过滤器
      path: https://filters.adtidy.org/extension/ublock/filters/11_optimized.txt
      type: adblock
      dialect: ubo

    - name: AdGuard 中文过滤器
      path: https://filters.adtidy.org/extension/ublock/filters/224_optimized.txt
      type: adblock
      dialect: ubo

    # ---------- 第三方规则 ----------
    - name: NoAppDownload
      path: https://raw.githubusercontent.com/Noyllopa/NoAppDownload/master/NoAppDownload.txt
      type: adblock
      dialect: ubo

    - name: xndeye web-ad-rule
      path: https://raw.githubusercontent.com/xndeye/web-ad-rule/master/easylist.txt
      type: adblock
      dialect: ubo

    - name: xinggsf movie
      path: https://raw.githubusercontent.com/xinggsf/Adblock-Plus-Rule/master/mv.txt
      type: adblock
      dialect: ubo

    - name: cjxlist annoyance
      path: https://raw.githubusercontent.com/cjx82630/cjxlist/master/cjx-annoyance.txt
      type: adblock
      dialect: ubo

    # ---------- ABP 官方过滤器 ----------
    - name: ABP filters
      path: https://easylist-downloads.adblockplus.org/antiadblockfilters.txt
      type: adblock
      dialect: abp

    - name: ABP 反广告过滤
      path: https://easylist-downloads.adblockplus.org/abp-filters-anti-cv.txt
      type: adblock
      dialect: abp

    - name: uBlockOrigin privacy
      path: https://raw.githubusercontent.com/uBlockOrigin/uAssets/refs/heads/master/filters/privacy.txt
      type: adblock
      dialect: ubo

    # ---------- 本仓库维护的私有规则 ----------
    - name: DD-AD
      path: rule/DD-AD.txt
      type: adblock
      dialect: ubo

  output:
    # 完整主规则（AdGuard / AdBlock / AdBlock Plus / uBlock Origin）
    - name: easylist.txt
      type: adblock
      dialect: ubo

    # 仅含 DNS 可拦截的域名规则（AdGuard Home）
    - name: dns.txt
      type: dns
      dialect: adguard
      file-header: |
        Title: DD-AD
        Last Modified: {{date}}
        Homepage: https://github.com/afwfv/DD-AD

    # 几乎所有操作系统原生支持
    - name: hosts
      type: hosts

    # Clash / Mihomo：payload + "+.domain" 域名规则集
    - name: clash.yaml
      type: mihomo
      dialect: domain
      container: yaml

    # dnsmasq 及其衍生版本
    - name: dnsmasq.conf
      type: dnsmasq

    # smartdns
    - name: smartdns.conf
      type: smartdns

  config:
    output-dir: rule

    file-header: |
      Title: DD-AD of {{type}}
      Last Modified: {{date}}
      Homepage: https://github.com/afwfv/DD-AD

    # 白名单：命中的域名不会出现在任何输出里
    rules:
      whitelist:
        # 屏蔽此域会导致Edge浏览器翻译不可用
        - edge.microsoft.com
        # 屏蔽此域会导致小米天气网络异常
        - metok.sys.miui.com
        # 屏蔽此域会导致10086 App登陆异常
        - client.app.coc.10086.cn
        # 屏蔽此域会导致MSN页面无法正常加载
        - assets.msn.com

    # 域名有效性检测：解析不到的域名不写入输出
    # 注意：servers 留空即使用系统 DNS。显式指定公共 DNS 时，dnsjava 的超时会被
    # 乘以 (服务器数 × 尝试次数 + 1)，且 A/AAAA 分别查询，托管 runner 上很容易
    # 每个域名吃满十几秒，整个任务直接跑不动。
    dns:
      enabled: false
      concurrency: 256
      timeout: 2s
      retries: 0
