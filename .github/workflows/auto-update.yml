name: Update Filters

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - '.devcontainer/**'
      - 'LICENSE'
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      release-branch:
        description: 'Release branch name'
        required: false
        default: 'release'
        type: string

env:
  TZ: Asia/Shanghai

concurrency:
  group: update-filters-${{ inputs.release-branch || 'release' }}
  cancel-in-progress: false

jobs:
  update-filters:
    # 分支上的 push 不触发，避免在测试分支上覆盖正式订阅分支
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Build filters
        run: |
          bash ./gradlew --no-daemon shadowJar
          mkdir -p logs
          java -jar "$(find build/libs -maxdepth 1 -name 'adfs-*-all.jar')" -c config/application.yaml

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs/*.log

      # ------------------------------------------------------------------
      # 发布产物：只保留「一份快照」，历史绝不累积。
      #
      # 每次造一个没有父提交的孤立提交，force push 覆盖发布分支：
      # 分支永远只有 1 个 commit，仓库体积 = 一份产物（约 10MB），
      # 而 raw / ghproxy / jsdelivr 的订阅地址完全不变。
      # ------------------------------------------------------------------
      - name: Publish snapshot
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch || 'release' }}
        run: |
          set -euo pipefail

          # 1. 清空工作区，只留下本次生成的产物（含手工维护的 rule/DD-AD.txt）
          find . -maxdepth 1 ! -name 'rule' ! -name '.' ! -name '.git' -exec rm -rf -- {} +
          mv rule/* .
          rmdir rule

          # 2. 造孤立提交（无父提交）
          git branch -D snapshot-release 2>/dev/null || true
          git checkout -q --orphan snapshot-release
          git rm -rqf --cached . || true
          git add -A -f .
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore: ✅ auto release at $(date +'%Y-%m-%d %H:%M:%S')"

          echo "snapshot 内容："
          git ls-tree -r -l HEAD

          # 3. 复用 checkout 注入的凭据强制覆盖发布分支
          git push -q --force origin "HEAD:${RELEASE_BRANCH}"

      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
